name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Validate release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw 'Expected vMAJOR.MINOR.PATCH tag' }
          [xml]$project = Get-Content -LiteralPath 'src/UsageMonitor.csproj'
          $version = [string]$project.Project.PropertyGroup.Version
          if ($tag -ne "v$version") { throw "Tag $tag does not match project version $version" }
      - name: Verify updater metadata and integrity
        shell: pwsh
        run: |
          dotnet run --project 'tests/Updates/Updates.csproj' -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Updater tests failed' }
          & './tests/Updates/InstallerChecks.ps1'
      - name: Publish standalone Windows executable
        shell: pwsh
        run: |
          dotnet publish 'src/UsageMonitor.csproj' -c Release -r win-x64 --self-contained true -o 'artifacts/release' -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
          Rename-Item -LiteralPath 'artifacts/release/AI Usage Monitor.exe' -NewName 'AI-Usage-Monitor-win-x64.exe'
          $asset = 'artifacts/release/AI-Usage-Monitor-win-x64.exe'
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'artifacts/release/SHA256SUMS.txt'), "$hash  AI-Usage-Monitor-win-x64.exe`n")
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            artifacts/release/AI-Usage-Monitor-win-x64.exe
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error

  release:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Create and verify release before publishing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          gh release create $tag 'release/AI-Usage-Monitor-win-x64.exe' 'release/SHA256SUMS.txt' --verify-tag --draft --title $tag --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; inspect any existing draft before retrying' }
          # A draft is visible in the authenticated release list before it is accessible by tag.
          $releaseId = gh api --paginate "repos/$env:GH_REPO/releases?per_page=100" --jq ".[] | select(.draft == true and .tag_name == `"$tag`") | .id"
          if ($LASTEXITCODE -ne 0 -or @($releaseId).Count -ne 1 -or $releaseId -notmatch '^\d+$') { throw 'Cannot identify created draft' }
          $json = gh api "repos/$env:GH_REPO/releases/$releaseId"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read created release' }
          $release = $json | ConvertFrom-Json
          $asset = @($release.assets | Where-Object { $_.name -eq 'AI-Usage-Monitor-win-x64.exe' })
          $expected = 'sha256:' + (Get-FileHash -LiteralPath 'release/AI-Usage-Monitor-win-x64.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($asset.Count -ne 1 -or $asset[0].digest -ne $expected) { throw 'GitHub asset digest mismatch; release left as draft' }
          gh api --method PATCH "repos/$env:GH_REPO/releases/$releaseId" -F draft=false -f make_latest=true --silent
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
